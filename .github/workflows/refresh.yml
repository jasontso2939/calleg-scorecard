name: refresh-data
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 13:17 UTC
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_raw.sh session
      - run: bash scripts/extract_raw.sh
      - run: PYTHONPATH=src python -m calleg.build
      - run: PYTHONPATH=src python scripts/build_site_all.py
      - run: PYTHONPATH=src python scripts/build_committees.py
      - run: PYTHONPATH=src python scripts/build_insights.py
      - run: PYTHONPATH=src python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-site-and-data
          path: |
            site/
            data/processed/
