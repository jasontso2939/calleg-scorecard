name: refresh-data
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 13:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/refresh.yml"]   # re-run when this pipeline changes
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: refresh-data, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_raw.sh session
      - run: bash scripts/extract_raw.sh
      - run: PYTHONPATH=src python -m calleg.build
      - run: PYTHONPATH=src python scripts/build_site.py
      - run: PYTHONPATH=src python scripts/build_committees.py
      - run: PYTHONPATH=src python scripts/build_insights.py
      - run: PYTHONPATH=src python -m pytest -q
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed site
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "Refresh data from the latest leginfo export"
            git push
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-site-and-data
          path: |
            site/
            data/processed/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}

  deploy:
    needs: refresh
    runs-on: ubuntu-24.04
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
