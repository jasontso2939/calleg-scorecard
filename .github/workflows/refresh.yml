name: refresh-data
on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 13:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/refresh.yml"]   # re-run when this pipeline changes
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency: {group: refresh-data, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Download the session in progress
        # From December of even years the new session is current. Its download can lag the
        # start of the session; until it appears, keep refreshing the previous one.
        run: |
          Y=$(python scripts/current_session.py)
          if ! bash scripts/fetch_raw.sh session "$Y"; then
            echo "pubinfo_$Y.zip not available yet; using $((Y - 2))"
            Y=$((Y - 2)); bash scripts/fetch_raw.sh session "$Y"
          fi
          echo "YEAR=$Y" >> "$GITHUB_ENV"
      - run: bash scripts/extract_raw.sh "$YEAR"
      - name: Earlier sessions (archive any that just finished)
        run: |
          if [ "$(bash scripts/ensure_archive.sh "$YEAR")" = "changed" ]; then
            rm -rf /tmp/arch && mkdir /tmp/arch && cp -r data/archive /tmp/arch/ && cd /tmp/arch
            git init -q -b session-archive && mkdir -p data && mv archive data/
            printf '%s\n' "Compact copies of finished California legislative sessions from the leginfo bulk export." \
              "Built by scripts/archive_session.py on main; SOURCE_SHA256.txt records each original download." > README.md
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Archive sessions through $((YEAR - 2))"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" session-archive
          fi
      - run: PYTHONPATH=src python -m calleg.build
      - run: PYTHONPATH=src python scripts/build_site.py
      - run: PYTHONPATH=src python scripts/build_committees.py
      - run: PYTHONPATH=src python scripts/build_people.py
      - run: PYTHONPATH=src python scripts/build_insights.py
      - run: PYTHONPATH=src python scripts/build_events.py
      - run: PYTHONPATH=src python -m pytest -q
      - name: Change report
        id: report
        run: PYTHONPATH=src python scripts/change_report.py --summary "$GITHUB_STEP_SUMMARY" --alert alert.md
      - name: Open an issue if headline numbers moved sharply
        if: hashFiles('alert.md') != ''
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh issue create --title "Data refresh $(date -u +%F): large changes to check" --body-file alert.md
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed site
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -q -F commit_message.txt
            git push
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-site-and-data
          path: |
            site/
            data/processed/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: site}

  deploy:
    needs: refresh
    runs-on: ubuntu-24.04
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
